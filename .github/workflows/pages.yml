name: Pages

# Builds the Astro docs site (site/) from docs/*.md and serves the one-line installers at
# https://axcel-blade.github.io/Photoshop-MCP/install.ps1 and /install.sh.
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "installers/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "installers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment (CD and a push to main can race).
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Installers are published
        run: test -s dist/install.ps1 && test -s dist/install.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
