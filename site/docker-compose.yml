# Production-like docs site: docker compose -f site/docker-compose.yml up --build -d
# -> http://localhost:8080/  (installers at /install.ps1 and /install.sh)
# Port in use? SITE_PORT=8088 docker compose -f site/docker-compose.yml up --build -d
services:
  site:
    build:
      context: ..
      dockerfile: site/Dockerfile
      args:
        ASTRO_SITE: http://localhost:${SITE_PORT:-8080}
        ASTRO_BASE: /
    image: photoshop-mcp-site:local
    ports:
      - "${SITE_PORT:-8080}:80"
    restart: unless-stopped
